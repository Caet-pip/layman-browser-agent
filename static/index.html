<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser Agent</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f0edfb;
    color: #111;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    padding: 13px 24px;
    border-bottom: 1px solid rgba(180,150,255,0.18);
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: blur(14px);
    flex-shrink: 0;
    z-index: 30;
  }
  header h1 { font-size: 14px; font-weight: 600; color: #1a1a1a; transition: opacity 0.3s; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ddd; transition: background 0.3s;
  }
  .status-dot.idle  { background: #7c3aed; }
  .status-dot.busy  { background: #a855f7; animation: pulse 1s infinite; }
  .status-dot.error { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* ── Main — fixed height, no scroll ── */
  main {
    flex: 1;
    min-height: 0;
    overflow: hidden;
    padding: 16px 20px 8px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    position: relative;
  }

  /* ── Ask-human ── */
  #ask-human {
    display: none;
    flex-direction: column;
    gap: 10px;
    background: rgba(255,255,255,0.78);
    backdrop-filter: blur(18px);
    border: 1.5px solid rgba(167,139,250,0.35);
    border-radius: 20px;
    padding: 14px 16px;
    box-shadow: 0 4px 28px rgba(124,58,237,0.07);
    flex-shrink: 0;
    z-index: 20;
  }
  #ask-human.visible { display: flex; }
  #ask-question { font-size: 13px; color: #4c1d95; line-height: 1.5; }
  #ask-row { display: flex; gap: 8px; }
  #ask-input {
    flex: 1;
    background: rgba(245,240,255,0.9);
    border: 1px solid #ddd6fe;
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 13px; color: #1a1a1a; outline: none;
  }
  #ask-input:focus { border-color: #7c3aed; }
  #ask-send {
    background: #7c3aed; color: #fff; border: none;
    border-radius: 12px; padding: 9px 16px;
    font-size: 13px; font-weight: 600; cursor: pointer;
    transition: opacity 0.2s;
  }
  #ask-send:hover { opacity: 0.85; }

  /* ── Card canvas — fills remaining space, locked ── */
  #card-canvas {
    position: relative;
    flex: 1;
    min-height: 0;
    overflow: visible;
  }

  /* ── Cards ── */
  .product-card {
    position: absolute;
    width: 178px;
    height: 178px;
    border-radius: 32px;
    cursor: grab;
    box-shadow: 0 6px 32px rgba(124,58,237,0.10), 0 1px 4px rgba(124,58,237,0.06);
    border: 1.5px solid rgba(196,181,253,0.45);
    background: #ede9fe;
    overflow: hidden;
    transition: height 0.35s cubic-bezier(.4,0,.2,1),
                width  0.35s cubic-bezier(.4,0,.2,1),
                box-shadow 0.25s, border-color 0.25s, border-radius 0.35s;
    z-index: 1;
    animation: fadeIn 0.32s ease;
  }
  .product-card:hover {
    height: 340px;
    width: 195px;
    border-radius: 36px;
    box-shadow: 0 16px 52px rgba(124,58,237,0.22), 0 2px 8px rgba(124,58,237,0.08);
    border-color: #c4b5fd;
    z-index: 20;
  }

  @keyframes fadeIn {
    from { opacity:0; transform:scale(0.93) translateY(8px); }
    to   { opacity:1; transform:scale(1) translateY(0); }
  }
  @keyframes bob {
    0%,100% { transform: translateY(0px); }
    50%      { transform: translateY(-7px); }
  }

  /* Image grows with the card */
  .card-image, .card-image-placeholder {
    width: 100%;
    height: 178px;
    object-fit: cover;
    display: block;
    background: #ede9fe;
    transition: height 0.35s cubic-bezier(.4,0,.2,1);
    flex-shrink: 0;
  }
  .product-card:hover .card-image,
  .product-card:hover .card-image-placeholder {
    height: 210px;
  }
  .card-image-placeholder {
    background: linear-gradient(135deg, #ede9fe 0%, #ddd6fe 100%);
    display: flex; align-items: center; justify-content: center;
    font-size: 34px;
  }

  /* Name overlaid at bottom of image */
  .card-name-overlay {
    position: absolute;
    left: 0; right: 0;
    bottom: 0;
    background: linear-gradient(to top, rgba(109,40,217,0.68) 0%, transparent 100%);
    color: #fff;
    font-size: 11px; font-weight: 600;
    padding: 22px 11px 10px;
    line-height: 1.3;
    pointer-events: none;
    transition: bottom 0.35s cubic-bezier(.4,0,.2,1);
  }
  .product-card:hover .card-name-overlay {
    bottom: 130px;
  }

  /* Details reveal on hover */
  .card-details {
    padding: 9px 12px 12px;
    background: #fff;
    opacity: 0;
    transform: translateY(5px);
    transition: opacity 0.22s 0.1s, transform 0.22s 0.1s;
  }
  .product-card:hover .card-details { opacity: 1; transform: translateY(0); }

  .card-store {
    font-size: 9px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em;
    color: #7c3aed; margin-bottom: 3px;
  }
  .card-price { font-size: 15px; font-weight: 700; color: #4c1d95; margin-bottom: 3px; }
  .card-detail { font-size: 10px; color: #aaa; margin-bottom: 5px; }
  .card-detail span { color: #7c3aed; font-weight: 500; }
  .card-justification {
    font-size: 10px; color: #bbb; line-height: 1.4;
    border-top: 1px solid #f3f0ff; padding-top: 5px;
  }

  /* ── Summary — hidden, lives inside thinking bar ── */
  #summary { display: none; }

  /* ── Thinking bar ── */
  #thinking-bar {
    display: none;
    flex-direction: column;
    background: rgba(237,233,254,0.9);
    border-top: 1px solid #e9d5ff;
    border-bottom: 1px solid #e9d5ff;
    font-size: 12px; color: #7c3aed;
    flex-shrink: 0; z-index: 10;
    transition: background 0.2s;
  }
  #thinking-bar.visible { display: flex; }
  #thinking-bar.done { cursor: pointer; }
  #thinking-bar.done:hover { background: rgba(221,214,254,0.95); }

  #thinking-bar-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 8px 22px;
  }

  .thinking-spinner {
    width: 12px; height: 12px;
    border: 2px solid #ddd6fe;
    border-top-color: #7c3aed;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  .done-dot {
    width: 8px; height: 8px;
    background: #7c3aed;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #expand-hint {
    margin-left: auto;
    font-size: 11px;
    color: #a78bfa;
    display: none;
  }
  #thinking-bar.done #expand-hint { display: block; }

  #summary-panel {
    display: none;
    padding: 10px 22px 14px;
    font-size: 12px;
    line-height: 1.7;
    color: #4c1d95;
    white-space: pre-wrap;
    border-top: 1px solid rgba(196,181,253,0.3);
    max-height: 200px;
    overflow-y: auto;
  }
  #summary-panel.open { display: block; }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Footer — frosted glass ── */
  footer {
    padding: 12px 18px;
    display: flex; gap: 10px;
    flex-shrink: 0;
    background: rgba(255,255,255,0.55);
    backdrop-filter: blur(22px);
    border-top: 1px solid rgba(196,181,253,0.18);
    z-index: 30;
  }
  #task-input {
    flex: 1;
    background: rgba(255,255,255,0.38);
    border: none;
    border-radius: 16px;
    padding: 11px 16px;
    font-size: 14px; color: #1a1a1a; outline: none;
    backdrop-filter: blur(18px);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5);
    transition: box-shadow 0.3s;
  }
  #task-input:focus {
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.6),
                0 0 12px rgba(167,139,250,0.15);
  }
  #task-input::placeholder { color: #c4b5fd; }
  #task-input:disabled { opacity: 0.4; cursor: not-allowed; }
  #task-input.shimmer {
    animation: shimmerPulse 1.8s ease-in-out infinite;
  }
  @keyframes shimmerPulse {
    0%,100% { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 0 0 0 rgba(124,58,237,0); }
    50%      { box-shadow: inset 0 0 0 1px rgba(255,255,255,0.5), 0 0 24px 4px rgba(124,58,237,0.2), 0 0 8px rgba(167,139,250,0.15); }
  }
  #send-btn {
    background: rgba(255,255,255,0.45);
    color: #7c3aed; border: none;
    border-radius: 16px; padding: 11px 22px;
    font-size: 14px; font-weight: 600;
    cursor: pointer;
    backdrop-filter: blur(14px);
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.35);
    transition: background 0.2s, box-shadow 0.2s;
  }
  #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  #send-btn:hover:not(:disabled) {
    background: rgba(255,255,255,0.62);
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.55), 0 0 12px rgba(124,58,237,0.12);
  }
</style>
</head>
<body>

<header>
  <div class="status-dot" id="status-dot"></div>
  <h1 id="page-title">Browser Agent</h1>
</header>

<main>
  <div id="ask-human">
    <div id="ask-question"></div>
    <div id="ask-row">
      <input id="ask-input" type="text" placeholder="Type your answer..." />
      <button id="ask-send">Reply</button>
    </div>
  </div>
  <div id="card-canvas"></div>
  <div id="summary"></div>
</main>

<div id="thinking-bar">
  <div id="thinking-bar-row">
    <div class="thinking-spinner" id="thinking-spinner"></div>
    <span id="thinking-text">Starting...</span>
    <span id="expand-hint">tap to expand ↕</span>
  </div>
  <div id="summary-panel"></div>
</div>

<footer>
  <input id="task-input" type="text" placeholder="Ask the agent to find something..." autofocus />
  <button id="send-btn">Send</button>
</footer>

<script>
  const dot       = document.getElementById('status-dot');
  const taskInput = document.getElementById('task-input');
  const sendBtn   = document.getElementById('send-btn');
  const canvas    = document.getElementById('card-canvas');
  const thinkBar     = document.getElementById('thinking-bar');
  const thinkText    = document.getElementById('thinking-text');
  const thinkSpinner = document.getElementById('thinking-spinner');
  const summaryPanel = document.getElementById('summary-panel');
  const summary      = document.getElementById('summary');
  const askHuman  = document.getElementById('ask-human');
  const askQ      = document.getElementById('ask-question');
  const askInput  = document.getElementById('ask-input');
  const askSend   = document.getElementById('ask-send');

  let ws = null;
  const CARD_W = 178, CARD_H = 178, PAD = 20;
  let placed = [];           // [{x, y}] for overlap detection
  const cardsByUrl = {};     // url → {el, pos}
  const BOB = [[2.9,0],[3.3,0.55],[2.6,1.1],[3.1,0.3],[3.6,0.85],[2.8,1.4]];
  let cardCount = 0;
  let dragState = null;      // active drag: {el, startX, startY, origX, origY, isDragging, url, bobStyle}

  document.addEventListener('mousemove', (e) => {
    if (!dragState) return;
    const dx = e.clientX - dragState.startX;
    const dy = e.clientY - dragState.startY;
    if (!dragState.isDragging && (Math.abs(dx) > 5 || Math.abs(dy) > 5)) {
      dragState.isDragging = true;
      dragState.el.style.animation = 'none';
      dragState.el.style.transition = 'none';
      dragState.el.style.cursor = 'grabbing';
      dragState.el.style.zIndex = '100';
    }
    if (dragState.isDragging) {
      const newX = dragState.origX + dx;
      const newY = dragState.origY + dy;
      dragState.el.style.left = newX + 'px';
      dragState.el.style.top  = newY + 'px';
      if (dragState.url && cardsByUrl[dragState.url]) {
        cardsByUrl[dragState.url].pos = { x: newX, y: newY };
      }
    }
  });

  document.addEventListener('mouseup', () => {
    if (!dragState) return;
    if (dragState.isDragging) {
      dragState.el.style.animation = dragState.bobStyle;
      dragState.el.style.transition = '';
      dragState.el.style.cursor = 'grab';
      dragState.el.style.zIndex = '1';
    } else if (dragState.url) {
      window.open(dragState.url, '_blank');
    }
    dragState = null;
  });

  function connect() {
    ws = new WebSocket(`ws://${location.host}/ws`);
    ws.onopen  = () => { dot.className = 'status-dot idle'; setInput(true); };
    ws.onerror = () => { dot.className = 'status-dot error'; };
    ws.onclose = () => {
      dot.className = 'status-dot error'; setInput(false);
      thinkText.textContent = 'Disconnected — reconnecting...';
      thinkBar.classList.add('visible');
      setTimeout(connect, 2000);
    };
    ws.onmessage = ({data}) => {
      const msg = JSON.parse(data);
      if (msg.type === 'thinking') {
        thinkBar.classList.add('visible');
        thinkText.textContent = msg.text;
      }
      else if (msg.type === 'product_card') { addCard(msg); }
      else if (msg.type === 'keep_cards') { keepCards(msg.urls); }
      else if (msg.type === 'ask_human') {
        thinkBar.classList.remove('visible');
        askQ.textContent = msg.question;
        askHuman.classList.add('visible');
        askInput.value = ''; askInput.focus();
      }
      else if (msg.type === 'update_title') {
        const title = document.getElementById('page-title');
        title.style.opacity = '0';
        setTimeout(() => { title.textContent = msg.text; title.style.opacity = '1'; }, 200);
      }
      else if (msg.type === 'done') {
        askHuman.classList.remove('visible');
        dot.className = 'status-dot idle';
        taskInput.classList.remove('shimmer');
        setInput(true);
        if (msg.text && msg.text.trim()) {
          // Switch thinking bar to "done" expandable mode
          thinkSpinner.style.display = 'none';
          thinkText.textContent = 'Done — agent has a summary';
          thinkBar.classList.add('visible');
          thinkBar.classList.add('done');
          summaryPanel.textContent = msg.text;
        } else {
          thinkBar.classList.remove('visible');
          thinkBar.classList.remove('done');
        }
      }
      else if (msg.type === 'error') {
        askHuman.classList.remove('visible');
        thinkBar.classList.remove('visible');
        thinkBar.classList.remove('done');
        dot.className = 'status-dot error';
        taskInput.classList.remove('shimmer');
        setInput(true);
      }
    };
  }

  function setInput(enabled) {
    taskInput.disabled = !enabled;
    sendBtn.disabled   = !enabled;
    if (enabled) taskInput.focus();
  }

  function send() {
    const task = taskInput.value.trim();
    if (!task || !ws || ws.readyState !== WebSocket.OPEN) return;
    taskInput.value = '';
    dot.className   = 'status-dot busy';
    setInput(false);
    taskInput.classList.add('shimmer');
    thinkBar.classList.add('visible');
    thinkBar.classList.remove('done');
    thinkSpinner.style.display = '';
    summaryPanel.classList.remove('open');
    summaryPanel.textContent = '';
    thinkText.textContent = 'Starting...';
    summary.classList.remove('visible');
    summary.textContent = '';
    canvas.innerHTML = '';
    placed.length = 0;
    Object.keys(cardsByUrl).forEach(k => delete cardsByUrl[k]);
    cardCount = 0;
    document.getElementById('page-title').textContent = 'Browser Agent';
    ws.send(JSON.stringify({ task }));
  }

  function sendAnswer() {
    const text = askInput.value.trim();
    if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
    askHuman.classList.remove('visible');
    thinkBar.classList.add('visible');
    thinkText.textContent = 'Got it...';
    ws.send(JSON.stringify({ type: 'human_answer', text }));
  }

  function keepCards(urls) {
    // Remove all cards not in the keep list
    Object.entries(cardsByUrl).forEach(([url, entry]) => {
      if (!urls.includes(url)) {
        entry.el.remove();
        delete cardsByUrl[url];
      }
    });
    // Rebuild placed[] from remaining cards
    placed = Object.values(cardsByUrl).map(e => e.pos);
  }

  function findPosition() {
    // Use actual canvas bounds so cards stay within the visible area
    const W = canvas.clientWidth  || 800;
    const H = canvas.clientHeight || 480;

    for (let i = 0; i < 120; i++) {
      const x = Math.random() * (W - CARD_W - PAD * 2) + PAD;
      const y = Math.random() * (H - CARD_H - PAD * 2) + PAD;
      const ok = placed.every(p =>
        x + CARD_W + PAD <= p.x || x >= p.x + CARD_W + PAD ||
        y + CARD_H + PAD <= p.y || y >= p.y + CARD_H + PAD
      );
      if (ok) { placed.push({x, y}); return {x, y}; }
    }
    // Fallback: grid-like overflow
    const cols = Math.floor(W / (CARD_W + PAD));
    const idx  = placed.length;
    const x    = PAD + (idx % cols) * (CARD_W + PAD);
    const y    = PAD + Math.floor(idx / cols) * (CARD_H + PAD);
    placed.push({x, y});
    return {x, y};
  }

  function addCard(card) {
    const {x, y} = findPosition();
    const [dur, del] = BOB[cardCount % BOB.length];
    cardCount++;

    const el = document.createElement('div');
    el.className = 'product-card';
    const bobStyle = `fadeIn 0.32s ease,bob ${dur}s ${del}s ease-in-out infinite`;
    el.style.cssText = `left:${x}px;top:${y}px;animation:${bobStyle};`;
    el.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      dragState = { el, startX: e.clientX, startY: e.clientY,
                    origX: parseFloat(el.style.left) || x,
                    origY: parseFloat(el.style.top)  || y,
                    isDragging: false, url: card.url, bobStyle };
    });

    // Track card by URL for removal
    if (card.url) cardsByUrl[card.url] = { el, pos: {x, y} };

    const imgHtml = card.image_url
      ? `<img class="card-image" src="${esc(card.image_url)}" referrerpolicy="no-referrer"
             alt="${esc(card.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
         <div class="card-image-placeholder" style="display:none">👟</div>`
      : `<div class="card-image-placeholder">👟</div>`;

    el.innerHTML = `
      ${imgHtml}
      <div class="card-name-overlay">${esc(card.name)}</div>
      <div class="card-details">
        <div class="card-store">${esc(card.store)}</div>
        <div class="card-price">${esc(card.price)}</div>
        <div class="card-detail">${esc(card.detail_label)}: <span>${esc(card.detail_value)}</span></div>
        <div class="card-justification">${esc(card.justification)}</div>
      </div>`;

    canvas.appendChild(el);
  }

  function esc(s) {
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  thinkBar.onclick = () => {
    if (!thinkBar.classList.contains('done')) return;
    summaryPanel.classList.toggle('open');
    document.getElementById('expand-hint').textContent =
      summaryPanel.classList.contains('open') ? 'tap to collapse ↑' : 'tap to expand ↕';
  };

  sendBtn.onclick     = send;
  taskInput.onkeydown = e => { if (e.key==='Enter') send(); };
  askSend.onclick     = sendAnswer;
  askInput.onkeydown  = e => { if (e.key==='Enter') sendAnswer(); };

  connect();
</script>
</body>
</html>
